" font-weight="400">프로세스의 가상주소공간 (위가 높은 주소)</text><rect x="120" y="92" width="200" height="40" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.4"/><text x="220.0" y="117.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="400">커널 가상 메모리</text><rect x="120" y="132" width="200" height="44" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><text x="220.0" y="159.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="400">사용자 스택</text><rect x="120" y="176" width="200" height="30" rx="4" fill="url(#hatch)" stroke="#D1D5DB" stroke-width="1.2"/><rect x="120" y="206" width="200" height="40" rx="4" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.4"/><text x="220.0" y="231.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle" font-weight="400">공유 라이브러리 영역</text><rect x="120" y="246" width="200" height="30" rx="4" fill="url(#hatch)" stroke="#D1D5DB" stroke-width="1.2"/><rect x="120" y="276" width="200" height="60" rx="4" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/><text x="220.0" y="311.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">힙</text><rect x="120" y="336" width="200" height="36" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.4"/><text x="220.0" y="359.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="400">.bss (초기화 안 된 데이터)</text><rect x="120" y="372" width="200" height="36" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.4"/><text x="220.0" y="395.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="400">.data (초기화된 데이터)</text><rect x="120" y="408" width="200" height="36" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.4"/><text x="220.0" y="431.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="400">.text (코드)</text><text x="28" y="108" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="700">높은 주소</text><text x="28" y="436" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="700">낮은 주소</text><line x1="336" y1="140" x2="336" y2="198" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/><text x="348" y="160" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#2563EB" text-anchor="start" font-weight="700">아래로</text><text x="348" y="176" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#2563EB" text-anchor="start" font-weight="700">자란다</text><line x1="336" y1="328" x2="336" y2="254" stroke="#15803D" stroke-width="2" marker-end="url(#ag)"/><text x="348" y="300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#15803D" text-anchor="start" font-weight="700">위로</text><text x="348" y="316" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#15803D" text-anchor="start" font-weight="700">자란다</text><line x1="72" y1="276" x2="118" y2="276" stroke="#B45309" stroke-width="2" marker-end="url(#aa)"/><text x="66" y="281" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#B45309" text-anchor="end" font-weight="700">brk</text><text x="28" y="474" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">힙은 .bss 바로 위에서 시작해 위로 자란다</text><text x="28" y="494" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">brk = 힙의 꼭대기.  sbrk(incr) 가 brk 를 옮긴다</text></svg>