<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1112" width="800" height="1112"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D1D5DB" stroke-width="3"/></pattern></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="799" height="1111" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/><text x="28" y="38" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" fill="#1F2937" text-anchor="start" font-weight="700">명시적 가용 리스트 — insert_free 한눈에</text><text x="28" y="62" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400">같은 빈 블록을 메모리 쪽에서 보면 주소 순, 목록 쪽에서 보면 스택</text><text x="28" y="100" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">① 메모리에서 본 모습 — 블록은 주소 순서대로 붙어 있다 (움직이지 않는다)</text><rect x="40" y="146" width="96" height="50" rx="4" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6" stroke-dasharray="4 3"/><text x="88.0" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#15803D" text-anchor="middle" font-weight="700">빈</text><text x="88.0" y="186" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#15803D" text-anchor="middle" font-weight="700">0x1018</text><path d="M91.0,144 Q142,124 187.0,144" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="142" y="146" width="96" height="50" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="190.0" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="700">할당</text><path d="M193.0,144 Q244,124 289.0,144" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="244" y="146" width="96" height="50" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/><text x="292.0" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">bp 방금 free</text><text x="292.0" y="186" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">0x1040</text><path d="M295.0,144 Q346,124 391.0,144" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="346" y="146" width="96" height="50" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="394.0" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="700">할당</text><path d="M397.0,144 Q448,124 493.0,144" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="448" y="146" width="96" height="50" rx="4" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6" stroke-dasharray="4 3"/><text x="496.0" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#15803D" text-anchor="middle" font-weight="700">빈</text><text x="496.0" y="186" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#15803D" text-anchor="middle" font-weight="700">0x1090</text><path d="M499.0,144 Q550,124 595.0,144" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="550" y="146" width="96" height="50" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><text x="598.0" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="700">할당</text><path d="M601.0,144 Q652,124 697.0,144" stroke="#9CA3AF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="652" y="146" width="96" height="50" rx="4" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6" stroke-dasharray="4 3"/><text x="700.0" y="168" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#15803D" text-anchor="middle" font-weight="700">빈</text><text x="700.0" y="186" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#15803D" text-anchor="middle" font-weight="700">0x1200</text><text x="40" y="222" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">회색 화살표 = NEXT_BLKP : 메모리에서 바로 옆 블록 (할당이든 빈 블록이든). coalesce 가 쓴다</text><text x="40" y="240" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">bp 양옆은 할당 블록이라 합칠 것이 없다 → 목록에 그대로 넣기만 하면 된다</text><text x="28" y="296" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">② 목록에서 본 모습 = 스택 (LIFO). 위로 갈수록 최근에 free 된 블록</text><text x="160" y="326" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="700">넣기 전</text><rect x="100" y="348" width="120" height="32" rx="16" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.6"/><text x="160" y="369" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="700">free_listp</text><line x1="160" y1="380" x2="160" y2="410" stroke="#1F2937" stroke-width="1.8" marker-end="url(#ak)"/><rect x="60" y="414" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/><text x="74" y="436" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#15803D" text-anchor="start" font-weight="700">0x1200</text><text x="74" y="458" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#6D28D9" text-anchor="start" font-weight="400">PRED : NULL</text><text x="74" y="476" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#2563EB" text-anchor="start" font-weight="400">SUCC : 0x1018</text><line x1="120" y1="490" x2="120" y2="532" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ab)"/><text x="112" y="515" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#2563EB" text-anchor="end" font-weight="700">SUCC</text><li