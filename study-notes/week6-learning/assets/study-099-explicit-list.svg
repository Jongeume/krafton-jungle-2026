pace" font-size="11" fill="#2563EB" text-anchor="start" font-weight="400">SUCC : NULL</text><text x="120" y="750" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400">↓ NULL (바닥)</text><text x="355" y="526" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700">push</text><line x1="320" y1="538" x2="390" y2="538" stroke="#B45309" stroke-width="2.2" marker-end="url(#aa)"/><text x="550" y="326" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">bp 를 넣은 뒤 (맨 위에 push)</text><rect x="490" y="348" width="120" height="32" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/><text x="550" y="369" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">free_listp</text><text x="620" y="369" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#DC2626" text-anchor="start" font-weight="700">④</text><line x1="550" y1="380" x2="550" y2="410" stroke="#DC2626" stroke-width="1.8" marker-end="url(#ar)"/><rect x="450" y="414" width="200" height="74" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/><text x="464" y="436" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#B45309" text-anchor="start" font-weight="700">0x1040  ← bp</text><text x="464" y="458" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#DC2626" text-anchor="start" font-weight="700">PRED : NULL</text><text x="464" y="476" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#DC2626" text-anchor="start" font-weight="700">SUCC : 0x1200</text><text x="656" y=