" text-anchor="end" font-weight="700">SUCC</text><line x1="590" y1="652" x2="590" y2="610" stroke="#6D28D9" stroke-width="1.6" marker-end="url(#ap)"/><text x="598" y="635" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6D28D9" text-anchor="start" font-weight="700">PRED</text><rect x="450" y="654" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/><text x="464" y="676" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#15803D" text-anchor="start" font-weight="700">0x1018</text><text x="464" y="698" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#6D28D9" text-anchor="start" font-weight="400">PRED : 0x1200</text><text x="464" y="716" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#2563EB" text-anchor="start" font-weight="400">SUCC : 0x1090</text><line x1="510" y1="730" x2="510" y2="772" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ab)"/><text x="502" y="755" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#2563EB" text-anchor="end" font-weight="700">SUCC</text><line x1="590" y1="772" x2="590" y2="730" stroke="#6D28D9" stroke-width="1.6" marker-end="url(#ap)"/><text x="598" y="755" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6D28D9" text-anchor="start" font-weight="700">PRED</text><rect x="450" y="774" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.6"/><text x="464" y="796" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#15803D" text-anchor="start" font-weight="700">0x1090</text><text x="464" y="818" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#6D28D9" text-anchor="start" font-weight="400">PRED : 0x1018</text><text x="464" y="836" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#2563EB" text-anchor="start" font-weight="400">SUCC : NULL</text><text x="510" y="870" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400">↓ NULL (바닥)</text><text x="40" y="908" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#DC2626" text-anchor="start" font-weight="700">①</text><text x="64" y="908" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">bp 의 SUCC = 원래 맨 위 블록 (<tspan font-family="'D2Coding', Consolas, 'Courier New', monospace">0x1200</tspan>)</text><text x="430" y="908" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400">free_listp 가 들고 있던 값을 복사</text><text x="40" y="934" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#DC2626" text-anchor="start" font-weight="700">②</text><text x="64" y="934" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">bp 의 PRED = NULL</text><text x="430" y="934" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400">맨 위라 위에 아무도 없다</text><text x="40" y="960" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#DC2626" text-anchor="start" font-weight="700">③</text><text x="64" y="960" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">원래 맨 위 블록의 PRED = bp</text><text x="430" y="960" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400">그 블록 위에 bp 가 올라왔다</text><text x="40" y="986" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#DC2626" text-anchor="start" font-weight="700">④</text><text x="64" y="986" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">free_listp = bp</text><text x="430" y="986" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400">표지판이 새 맨 위를 가리킨다 (마지막에 해야 <tspan font-family="'D2Coding', Consolas, 'Courier New', monospace">0x1200</tspan> 을 안 잃는다)</text><rect x="28" y="1018" width="744" height="74" rx="8" fill="#F3F4F6"/><text x="44" y="1046" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#2563EB" text-anchor="start" font-weight="700">SUCC = 스택에서 한 칸 아래 (먼저 들어온 쪽) = 목록의 next</text><text x="44" y="1070" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#6D28D9" text-anchor="start" font-weight="700">PRED = 스택에서 한 칸 위 (나중에 들어온 쪽) = 목록의 prev</text></svg>