to Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400">9.9.11 부터</text><line x1="94" y1="184" x2="94" y2="140" stroke="#DC2626" stroke-width="2" marker-end="url(#ar)"/><text x="74" y="200" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#DC2626" text-anchor="start" font-weight="700">bp — malloc 이 돌려주는 포인터</text><text x="24" y="238" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">헤더 한 워드 (32비트)</text><rect x="24" y="248" width="272" height="40" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="160" y="273" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#B45309" text-anchor="middle" font-weight="700">블록 크기 (상위 29비트)</text><rect x="296" y="248" width="40" height="40" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/><text x="316" y="274" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="700">0</text><rect x="336" y="248" width="40" height="40" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/><text x="356" y="274" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#6B7280" text-anchor="middle" font-weight="700">0</text><rect x="376" y="248" width="40" height="40" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="396" y="274" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#DC2626" text-anchor="middle" font-weight="700">a</text><text x="24" y="310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#DC2626" text-anchor="start" font-weight="700">a = 1 : 할당됨      a = 0 : 가용</text><text x="24" y="332" font-family="Pretendard, 'Apple SD Gothi