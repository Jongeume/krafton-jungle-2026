<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D1D5DB" stroke-width="3"/></pattern></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="799" height="699" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/><text x="28" y="38" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" fill="#1F2937" text-anchor="start" font-weight="700">공유 객체 — 그림 9.29</text><text x="28" y="62" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400">같은 파일을 공유로 매핑한 두 프로세스 · 칸 높이는 크기 비율이 아니다</text><text x="130.0" y="104" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="700">프로세스 1</text><text x="130.0" y="121" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" font-weight="400">가상 주소공간</text><rect x="40" y="130" width="180" height="300" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="400.0" y="104" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="700">물리 메모리</text><text x="400.0" y="121" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" font-weight="400">한 벌만 있다</text><rect x="310" y="130" width="180" height="300" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><text x="670.0" y="104" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="700">프로세스 2</text><text x="670.0" y="121" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" font-weight="400">가상 주소공간</text><rect x="580" y="130" width="180" height="300" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><rect x="52" y="310" width="156" height="60" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="130.0" y="338.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#B45309" text-anchor="middle" font-weight="700">공유 영역</text><text x="130.0" y="355.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" font-weight="400">MAP_SHARED</text><rect x="592" y="180" width="156" height="60" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="670.0" y="208.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#B45309" text-anchor="middle" font-weight="700">공유 영역</text><text x="670.0" y="225.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" font-weight="400">MAP_SHARED</text><rect x="322" y="245" width="156" height="60" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="400.0" y="273.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#B45309" text-anchor="middle" font-weight="700">객체의 페이지</text><text x="400.0" y="290.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" font-weight="400">물리 페이지</text><path d="M208,340 C260,340 270,275 320,275" stroke="#B45309" stroke-width="1.8" fill="none" marker-end="url(#aa)"/><path d="M592,210 C540,210 530,275 480,275" stroke="#B45309" stroke-width="1.8" fill="none" marker-end="url(#aa)"/><text x="130" y="390" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400">아래쪽 주소</text><text x="670" y="260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400">위쪽 주소</text><line x1="400" y1="307" x2="400" y2="484" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aa)"/><rect x="338.9" y="448" width="122.2" height="19" rx="4" fill="#FFFFFF"/><text x="400" y="460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">쓰기는 파일에도 반영</text><rect x="310" y="486" width="180" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="400" y="508" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">공유 객체</text><text x="400" y="526" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400">디스크의 파일</text><text x="40" y="582" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="400">1.  프로세스 1 이 파일을 공유로 매핑한다 → 물리 메모리에 한 벌</text><text x="40" y="608" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="400">2.  프로세스 2 가 같은 파일을 매핑한다 → 커널이 파일 이름으로 알아보고 PTE 를 같은 물리 페이지로</text><text x="40" y="634" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="400">3.  가상주소는 서로 달라도 된다 (프로세스 1 은 아래쪽, 2 는 위쪽)</text><text x="40" y="660" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="400">4.  한쪽이 쓰면 다른 쪽에도 보이고, 디스크의 파일에도 반영된다</text></svg>