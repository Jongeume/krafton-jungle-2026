chor="start" font-weight="400">파일 조각 하나를 가상 주소공간의 새 영역에 붙인다</text><text x="40" y="106" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">디스크 파일  (fd 로 연 것)</text><rect x="40" y="140" width="720" height="44" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/><rect x="300" y="140" width="260" height="44" rx="0" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/><text x="430.0" y="167" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">length 바이트</text><text x="52" y="167" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">파일 0번째 바이트</text><path d="M43,190 L43,198 L297,198 L297,190" stroke="#1F2937" stroke-width="1.4" fill="none"/><text x="170.0" y="218" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="700">offset</text><text x="40" y="296" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">프로세스의 가상 주소공간</text><rect x="40" y="330" width="720" height="44" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/><rect x="420" y="330" width="260" height="44" rx="0" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/><text x="550.0" y="357" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">새 영역</text><path d="M300,186 L420,328" stroke="#B45309" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/><path d="M560,186 L680,328" stroke="#B45309" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/><line x1="420" y1="420" x2="420" y2="378" stroke="#2563EB" stroke-width="1.6" marker-end="url(#ab)"/><text x="420" y="440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="700">start : 여기서 시작하면 좋겠다는 힌트 (보통 NULL)</text><text x="420" y="462" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">돌려주는 값 : 실제로 잡힌 새 영역의 시작 주소</text><text x="40" y="512" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="13" fill="#1F2937" text-anchor="start" font-weight="700">mmap(start, length, prot, flags, fd, offset)</text><text x="40" y="538" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="400">→ 파일의 offset 부터 length 바이트를 새 가상 영역에 매핑한다</text><text x="40" y="564" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#1F2937" text-anchor="start" font-weight="400">prot = 이 영역 페이지의 권한,  flags = 공유 · 사적 · 익명</text></svg>