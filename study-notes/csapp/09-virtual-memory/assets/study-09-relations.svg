1" fill="#6B7280" text-anchor="middle" font-weight="400">5 · VPO 1</text><line x1="230" y1="282" x2="310" y2="282" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="318" width="190" height="56" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/><text x="52" y="335" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#15803D" text-anchor="start" font-weight="700">VP3  (VPN 11)</text><rect x="52" y="342" width="80" height="26" rx="3" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/><text x="92" y="360" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#15803D" text-anchor="middle" font-weight="400">6 · VPO 0</text><rect x="140" y="342" width="80" height="26" rx="3" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/><text x="180" y="360" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="11" fill="#15803D" text-anchor="middle" font-weight="400">7 · VPO 1</text><line x1="230" y1="346" x2="310" y2="346" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#a)"/><rect x="310" y="126" width="180" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><text x="322" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#2563EB" text-anchor="start" font-weight="700">PTE[00]</text><text x="322" y="168" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#2563EB" text-anchor="start" font-weight="400">valid 1 | PPN = 1</text><line x1="490" y1="154" x2="580" y2="154" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/><rect x="310" y="190" width="180" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="322" y="210" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#B45309" text-anchor="start" font-weight="700">PTE[01]</text><