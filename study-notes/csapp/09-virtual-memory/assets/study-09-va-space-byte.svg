<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" width="800" height="630"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D1D5DB" stroke-width="3"/></pattern></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="799" height="629" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/><text x="28" y="38" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" fill="#1F2937" text-anchor="start" font-weight="700">가상주소공간 · 가상주소 · 바이트 값</text><text x="28" y="62" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400">예시 값(0x12345678, 0x1000)은 설명용 · x86-64 리틀 엔디안 기준 · 번지수는 저장되지 않고 칸의 내용만 저장된다</text><text x="40" y="100" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#6D28D9" text-anchor="start" font-weight="700">가상주소공간 = 번지수의 집합 {0 … N-1}</text><text x="40" y="120" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#2563EB" text-anchor="start" font-weight="700">가상메모리 = 그 번지수가 가리키는 1바이트 칸들의 배열</text><text x="170" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="end" font-weight="700">번지수 (VA)</text><text x="236" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="700">바이트 값</text><text x="170" y="177" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x1000</text><rect x="186" y="158" width="100" height="28" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="236" y="177" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700">78</text><text x="170" y="205" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x1001</text><rect x="186" y="186" width="100" height="28" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="236" y="205" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700">56</text><text x="170" y="233" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x1002</text><rect x="186" y="214" width="100" height="28" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="236" y="233" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700">34</text><text x="170" y="261" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x1003</text><rect x="186" y="242" width="100" height="28" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/><text x="236" y="261" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#B45309" text-anchor="middle" font-weight="700">12</text><text x="236" y="292" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" fill="#6B7280" text-anchor="middle" font-weight="700">⋮</text><text x="170" y="325" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2000</text><rect x="186" y="306" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="325" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">00</text><text x="170" y="353" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2001</text><rect x="186" y="334" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="353" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">10</text><text x="170" y="381" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2002</text><rect x="186" y="362" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="381" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">00</text><text x="170" y="409" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2003</text><rect x="186" y="390" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="409" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">00</text><text x="170" y="437" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2004</text><rect x="186" y="418" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="437" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">00</text><text x="170" y="465" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2005</text><rect x="186" y="446" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="465" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">00</text><text x="170" y="493" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2006</text><rect x="186" y="474" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="493" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">00</text><text x="170" y="521" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#6D28D9" text-anchor="end" font-weight="400">0x2007</text><rect x="186" y="502" width="100" height="28" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/><text x="236" y="521" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="14" fill="#15803D" text-anchor="middle" font-weight="700">00</text><path d="M296,160 L304,160 L304,268 L296,268" stroke="#B45309" stroke-width="1.6" fill="none"/><text x="312" y="208" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#B45309" text-anchor="start" font-weight="700">int x = 0x12345678</text><text x="312" y="226" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">4바이트 · 리틀 엔디안</text><path d="M296,308 L304,308 L304,528 L296,528" stroke="#15803D" stroke-width="1.6" fill="none"/><text x="312" y="412" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#15803D" text-anchor="start" font-weight="700">int *p = 0x1000</text><text x="312" y="430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">8바이트 · 리틀 엔디안</text><circle cx="446" cy="418" r="3.5" fill="#B45309" stroke="#B45309" stroke-width="1.5"/><path d="M446,418 L482,418 L482,172 L290,172" stroke="#B45309" stroke-width="2" fill="none" marker-end="url(#aa)"/><text x="388" y="164" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">값 0x1000 을 번지수로 쓰면</text><rect x="500" y="140" width="272" height="86" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.4"/><text x="514" y="164" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#6D28D9" text-anchor="start" font-weight="700">번지수 = 가상주소(VA)</text><text x="514" y="184" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">칸을 찾는 인덱스 (몇 번째 칸인가)</text><text x="514" y="204" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">저장되지 않는다 — 위치가 곧 번호</text><rect x="500" y="238" width="272" height="86" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><text x="514" y="262" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#2563EB" text-anchor="start" font-weight="700">바이트 값 = 데이터</text><text x="514" y="282" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">칸 하나에 0 ~ 255 값 하나 (16진수 두 자리)</text><text x="514" y="302" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">무엇인지는 읽는 쪽이 해석한다</text><rect x="500" y="336" width="272" height="126" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="514" y="360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="13" fill="#B45309" text-anchor="start" font-weight="700">같은 숫자 0x1000 의 두 얼굴</text><text x="514" y="380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">① 0x1000 번 칸의 번지수 (인덱스)</text><text x="514" y="400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">② p 의 8칸에 값으로 든 데이터</text><text x="514" y="420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">p 를 주소로 쓰는 순간 ②가 ①이 되어</text><text x="514" y="440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#6B7280" text-anchor="start" font-weight="400">0x1000 번 칸(x 의 첫 바이트)을 읽는다</text><rect x="28" y="552" width="744" height="58" rx="8" fill="#F3F4F6"/><text x="44" y="576" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">칸이 두 종류다 — 번지수를 적는 비트 칸(n개)  ≠  번지수가 가리키는 바이트 칸(N = 2^n개)</text><text x="44" y="596" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400">가상주소는 바이트 칸 배열의 인덱스이고, 칸 안의 바이트 값이 데이터다. 값이 다른 칸의 인덱스로 쓰이면 포인터</text></svg>