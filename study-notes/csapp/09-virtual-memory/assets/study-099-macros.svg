, monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">HDRP(bp)</text><text x="184" y="258" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">= bp − 4</text><circle cx="34" cy="282" r="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="34" y="286" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">2</text><text x="54" y="286" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">FTRP(bp)</text><text x="184" y="286" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">= bp + 크기 − 8</text><circle cx="34" cy="310" r="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="34" y="314" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">3</text><text x="54" y="314" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">NEXT_BLKP(bp)</text><text x="184" y="314" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">= bp + 크기</text><circle cx="34" cy="338" r="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/><text x="34" y="342" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">4</text><text x="54" y="342" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">PREV_BLKP(bp)</text><text x="184" y="342" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">= bp − 이전 블록 크기</text><rect x="20" y="376" width="400" height="82" rx="8" fill="#F3F4F6"/><text x="34" y="400" font-family="'D2Coding', Consolas, 'Courier New', monospace" font-size="12" fill="#1F2937" text-anchor="start" font-weight="700">크기 = GET_SIZE(HDRP(bp))</text><text x="34" y="422" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">헤더 · 풋터까지 포함한 블록 전체의 크기다</text><text x="34" y="444" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="12" fill="#1F2937" text-anchor="start" font-weight="400">이전 블록 크기는 bp − 8 (이전 블록의 풋터)에서 읽는다</text></svg>